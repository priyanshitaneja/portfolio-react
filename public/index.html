  <script>
    // Self-referencing canonical.
    // CRA serves this one document for every route, so a hardcoded canonical would
    // declare /work, /projects and /contact duplicates of / and de-index them.
    // /about renders the same component as / and is folded into it deliberately.
    // Replaced by the Next.js Metadata API in the App Router migration.
    (function () {
      var path = window.location.pathname.replace(/\/+$/, '') || '/';
      if (path === '/about') path = '/';
      var link = document.createElement('link');
      link.rel = 'canonical';
      link.href = 'https://www.priyanshitaneja.com' + (path === '/' ? '/' : path);
      document.head.appendChild(link);
    })();
  </script>

  <script>
    // Default to poetcore — toggle icon available to switch themes

    })();
  </script>
